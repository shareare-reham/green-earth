<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- DaisyUi+Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- title -->
    <title>Document</title>
  </head>
  <body>
    <!-- navBar -->
    <header class="bg-[#15803D] text-white">
      <div class="navbar w-11/12 mx-auto">
        <div class="navbar-start">
          <div class="dropdown">
            <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </div>
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
            >
              <li><a>About</a></li>
              <li>
                <a>Gallary</a>
              </li>
              <li><a>Plant a Tree</a></li>
            </ul>
          </div>
          <a class="text-xl font-semibold">Green Earth</a>
        </div>
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <li><a>About</a></li>
            <li>
              <a>Gallary</a>
            </li>
            <li><a>Plant a Tree</a></li>
          </ul>
        </div>
        <div class="navbar-end">
          <button class="bg-[#FFD100] hover:bg-yellow-400 px-3 py-2 rounded-3xl text-md">
            <a class="text-[#15803D]">Plant a Tree</a>
          </button>
        </div>
      </div>
    </header>
    <!-- Hero -->
    <section class="bg-[#CFF0DC] px-3 py-5 md:p-0">
      <div class="flex justify-between items-center">
        <div class="w-1/4 hidden md:block">
          <img src="./assets/hero-leaf1.png" alt="" />
        </div>
        <div class="flex flex-col items-center">
          <h1 class="text-[#1F2937] text-3xl text-center font-bold mb-2">Plant a Tree, Grow a Future</h1>
          <p class="text-gray-700 mb-8 max-w-lg mx-auto text-sm text-center md:text-base">
            Join our mission to plant 1 million trees and make the Earth greener
            for future generations.
          </p>
          <button
            class="bg-[#FFD100] text-[#15803D] font-semibold py-3 px-8 rounded-full hover:bg-yellow-400"
          >
            Get Involved
          </button>
        </div>
        <div class="w-1/4 hidden md:block">
          <img src="./assets/hero-leaf2.png" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
